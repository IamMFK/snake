<script type="text/javascript" src="https://gc.kis.v2.scr.kaspersky-labs.com/FD126C42-EBFA-4E12-B309-BB3FDD723AC1/main.js?attr=qHYpglzv_zFvdwwP0oFTJFp9Oq7SFIj3JOSl01R34JsFfmpcED87Byysv7fQGL4bfYL9Ikqqk_nxooKi4IjlBTWG2f6Bpw4NAGzcRtFs9iAN1LqNLzcOttWVSEBQWa_h0IXCdt3TZnH9H8ZsanhnXx2elPep79IOsji5zKQfh6E5RhRDRJSQ57aGCC1jxp9-hnbL4ICDna3bf-l_yG9U89HeJv9Gu8eXQeBX8SbSBIqilQWR1bEUSUGy7Vbd_kpb16FJWyKUT_GkUR0-y97ZAODhkPuCFpzbfm4Sq7VfAuxKC3c5PxTVGBxTwXhzOSjD" charset="UTF-8"></script><link rel="stylesheet" crossorigin="anonymous" href="https://gc.kis.v2.scr.kaspersky-labs.com/E3E8934C-235A-4B0E-825A-35A08381A191/abn/main.css?attr=aHR0cHM6Ly9jaGF0Z3B0LmNvbS9iYWNrZW5kLWFwaS9lc3R1YXJ5L2NvbnRlbnQ_aWQ9ZmlsZV8wMDAwMDAwMDY5YTA4MjQzYmIxOWJmOWQ5M2VkMWNiNiZmbj1zbmFrZV9mYXJzaS5odG1sJmNkPWF0dGFjaG1lbnQmdHM9NDk3NjMwJnA9ZnMmY2lkPTEmc2lnPTU0YzkzNWNlYThmYWRmYzNiYTUxYjRjZTg0NjY1OWUzMzQzZTUxOGUyMTg5N2Q2ZjY4ZTExMjVhNmZhNGM2MzQmdj0w"/><style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:Tahoma,"Segoe UI",sans-serif;
  background:#090d14;
  color:#eef3f8;
  display:flex;
  align-items:center;
  justify-content:center;
}
.game{
  width:min(96vw,1400px);
  height:min(94vh,900px);
  display:flex;
  flex-direction:column;
  gap:14px;
}
.topbar{
  min-height:78px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:14px 20px;
  background:#111824;
  border:1px solid #202b3a;
  border-radius:20px;
  box-shadow:0 16px 50px #0006;
}
.brand{
  display:flex;align-items:center;gap:12px;white-space:nowrap
}
.logo{
  width:44px;height:44px;border-radius:14px;
  display:grid;place-items:center;
  background:#4da3ff;color:#06111f;
  font-size:24px;font-weight:900;
  box-shadow:0 0 25px #4da3ff38;
}
.title{font-size:22px;font-weight:800}
.subtitle{font-size:12px;color:#7f8da1;margin-top:3px}
.stats{display:flex;gap:10px}
.stat{
  min-width:105px;padding:8px 14px;text-align:center;
  background:#0b111a;border:1px solid #202b3a;border-radius:13px;
}
.stat span{display:block;color:#7f8da1;font-size:11px;margin-bottom:3px}
.stat b{font-size:18px}
.actions{display:flex;gap:8px}
button{
  border:1px solid #293548;background:#172131;color:#dfe8f1;
  padding:10px 15px;border-radius:12px;cursor:pointer;
  font:inherit;font-size:13px;transition:.18s;
}
button:hover{background:#202d40;border-color:#3b4b62}
button:active{transform:translateY(1px)}
.board-wrap{
  position:relative;flex:1;min-height:0;
  display:flex;align-items:center;justify-content:center;
  background:#0d131d;border:1px solid #202b3a;border-radius:24px;
  overflow:hidden;box-shadow:0 20px 70px #0007;
}
canvas{display:block;background:#0b1119;border-radius:17px}
.overlay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#080c13b8;backdrop-filter:blur(7px);
  opacity:0;pointer-events:none;transition:.2s;
}
.overlay.show{opacity:1;pointer-events:auto}
.panel{
  width:min(420px,90%);padding:34px;text-align:center;
  background:#111925;border:1px solid #2a3749;border-radius:24px;
  box-shadow:0 25px 80px #0009;
}
.panel h1{margin:0 0 10px;font-size:30px}
.panel p{margin:0 0 24px;color:#9ba9ba;line-height:1.8}
.primary{
  width:100%;background:#4da3ff;color:#06111f;border:0;
  font-weight:800;padding:13px;border-radius:13px;
}
.primary:hover{background:#69b5ff}
.help{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  color:#627086;font-size:11px;white-space:nowrap;
  background:#0b1119dd;padding:7px 12px;border-radius:10px;
  border:1px solid #1c2735;
}
@media(max-width:850px){
  .game{width:98vw;height:96vh}
  .topbar{padding:10px 12px}
  .brand .subtitle{display:none}
  .title{font-size:18px}
  .logo{width:38px;height:38px}
  .stat{min-width:75px;padding:7px 9px}
  .actions button{font-size:11px;padding:9px}
}
@media(max-width:650px){
  .game:after{
    content:"این بازی برای نمایشگر بزرگ و کنترل با کیبورد طراحی شده است.";
    position:fixed;inset:0;background:#090d14;z-index:20;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:35px;color:#b7c2d0;font-size:18px;line-height:2;
  }
}
</style>
</head>
<body>
<div class="game">
  <div class="topbar">
    <div class="brand">
      <div class="logo">🐍</div>
      <div>
        <div class="title">بازی مار</div>
        <div class="subtitle">هرچه بیشتر بخوری، بزرگ‌تر می‌شوی!</div>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><span>امتیاز</span><b id="score">۰</b></div>
      <div class="stat"><span>طول مار</span><b id="length">۳</b></div>
      <div class="stat"><span>رکورد</span><b id="best">۰</b></div>
    </div>

    <div class="actions">
      <button id="pauseBtn">توقف</button>
      <button id="restartBtn">شروع دوباره</button>
    </div>
  </div>

  <div class="board-wrap" id="boardWrap">
    <canvas id="canvas"></canvas>

    <div class="overlay" id="overlay">
      <div class="panel">
        <h1 id="overlayTitle">بازی تمام شد</h1>
        <p id="overlayText">مار با خودش برخورد کرد.</p>
        <button class="primary" id="overlayBtn">دوباره بازی کن</button>
      </div>
    </div>

    <div class="help">حرکت: کلیدهای جهت‌دار یا W A S D &nbsp; • &nbsp; توقف: Space یا P</div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("boardWrap");

  const scoreEl = document.getElementById("score");
  const lengthEl = document.getElementById("length");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayText = document.getElementById("overlayText");
  const overlayBtn = document.getElementById("overlayBtn");
  const pauseBtn = document.getElementById("pauseBtn");

  const CELL = 24;
  let cols, rows, dpr;
  let snake, previousSnake, food, dir, nextDir;
  let score, best;
  let running = false, paused = false, gameOver = false;
  let lastMove = 0, accumulator = 0;
  let moveInterval = 112;
  let pulse = 0;
  let particles = [];

  try { best = Number(localStorage.getItem("snakeBest") || 0); }
  catch { best = 0; }

  const fa = n => n.toLocaleString("fa-IR");

  function resize() {
    const rect = wrap.getBoundingClientRect();
    const maxW = Math.max(360, rect.width - 26);
    const maxH = Math.max(260, rect.height - 26);
    cols = Math.max(18, Math.floor(maxW / CELL));
    rows = Math.max(12, Math.floor(maxH / CELL));

    let w = cols * CELL, h = rows * CELL;
    const scale = Math.min(maxW / w, maxH / h);
    w *= scale; h *= scale;

    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    draw();
  }

  function reset() {
    const cx = Math.floor(cols / 2);
    const cy = Math.floor(rows / 2);
    snake = [
      {x:cx, y:cy},
      {x:cx-1, y:cy},
      {x:cx-2, y:cy}
    ];
    previousSnake = snake.map(s => ({...s}));
    previousSnake = snake.map(s => ({...s}));
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    moveInterval = 112;
    paused = false;
    gameOver = false;
    running = true;
    particles = [];
    placeFood();
    updateUI();
    hideOverlay();
    pauseBtn.textContent = "توقف";
  }

  function placeFood() {
    let tries = 0;
    do {
      food = {
        x: Math.floor(Math.random() * cols),
        y: Math.floor(Math.random() * rows)
      };
      tries++;
    } while (snake.some(s => s.x === food.x && s.y === food.y) && tries < 1000);
  }

  function updateUI() {
    scoreEl.textContent = fa(score);
    lengthEl.textContent = fa(snake.length);
    bestEl.textContent = fa(best);
  }

  function setDirection(x,y) {
    if (!running || paused || gameOver) return;
    if (x === -dir.x && y === -dir.y) return;
    if (x === -nextDir.x && y === -nextDir.y) return;
    nextDir = {x,y};
  }

  function step() {
    previousSnake = snake.map(s => ({...s}));
    dir = nextDir;
    const head = {
      x: snake[0].x + dir.x,
      y: snake[0].y + dir.y
    };

    if (
      head.x < 0 || head.x >= cols ||
      head.y < 0 || head.y >= rows
    ) {
      endGame("به دیوار برخورد کردی!");
      return;
    }

    const ate = head.x === food.x && head.y === food.y;
    const checkLength = ate ? snake.length : snake.length - 1;

    for (let i=0;i<checkLength;i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        endGame("به بدن خودت برخورد کردی!");
        return;
      }
    }

    snake.unshift(head);

    if (ate) {
      score += 10;
      if (score > best) {
        best = score;
        try { localStorage.setItem("snakeBest", best); } catch {}
      }
      moveInterval = Math.max(55, 112 - Math.floor(score / 30) * 4);
      burst(food.x, food.y);
      placeFood();
    } else {
      snake.pop();
    }

    updateUI();
  }

  function endGame(message) {
    running = false;
    gameOver = true;
    paused = false;
    overlayTitle.textContent = "بازی تمام شد";
    overlayText.textContent = message + " امتیاز نهایی: " + fa(score);
    overlayBtn.textContent = "دوباره بازی کن";
    overlay.classList.add("show");
    pauseBtn.textContent = "توقف";
  }

  function togglePause() {
    if (!running || gameOver) return;
    paused = !paused;
    pauseBtn.textContent = paused ? "ادامه" : "توقف";
    if (paused) {
      overlayTitle.textContent = "بازی متوقف شد";
      overlayText.textContent = "برای ادامه روی دکمه زیر بزن یا کلید Space را فشار بده.";
      overlayBtn.textContent = "ادامه بازی";
      overlay.classList.add("show");
    } else {
      hideOverlay();
    }
  }

  function hideOverlay() {
    overlay.classList.remove("show");
  }

  function burst(x,y) {
    for(let i=0;i<14;i++){
      const a = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random()*2.2;
      particles.push({
        x:(x+.5)*CELL, y:(y+.5)*CELL,
        vx:Math.cos(a)*speed, vy:Math.sin(a)*speed,
        life:1, size:2+Math.random()*3
      });
    }
  }

  function roundRect(x,y,w,h,r) {
    const rr=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x, y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function draw() {
    if (!cols || !rows || !snake) return;

    const W=cols*CELL, H=rows*CELL;
    ctx.clearRect(0,0,W,H);

    ctx.fillStyle="#0b1119";
    ctx.fillRect(0,0,W,H);

    ctx.strokeStyle="rgba(255,255,255,.035)";
    ctx.lineWidth=1;
    for(let x=0;x<=cols;x++){
      ctx.beginPath();ctx.moveTo(x*CELL+.5,0);ctx.lineTo(x*CELL+.5,H);ctx.stroke();
    }
    for(let y=0;y<=rows;y++){
      ctx.beginPath();ctx.moveTo(0,y*CELL+.5);ctx.lineTo(W,y*CELL+.5);ctx.stroke();
    }

    pulse += .045;
    const glow = 8 + Math.sin(pulse)*3;
    const fx=(food.x+.5)*CELL, fy=(food.y+.5)*CELL;

    ctx.save();
    ctx.shadowColor="#ffca57";
    ctx.shadowBlur=18+glow;
    ctx.fillStyle="#ffca57";
    ctx.beginPath();
    ctx.arc(fx,fy,CELL*.29+Math.sin(pulse)*1.5,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle="#fff1b8";
    ctx.beginPath();
    ctx.arc(fx-CELL*.09,fy-CELL*.1,CELL*.07,0,Math.PI*2);
    ctx.fill();

    const progress=Math.min(1, accumulator / moveInterval);
    const renderPos = (i) => {
      const current = snake[i];
      const previous = previousSnake && previousSnake[i] ? previousSnake[i] : current;
      return {
        x: previous.x + (current.x - previous.x) * progress,
        y: previous.y + (current.y - previous.y) * progress
      };
    };

    // بدن مار به‌صورت یک مسیر ضخیم و پیوسته و با درون‌یابی بین دو حرکت رسم می‌شود.
    const positions = snake.map((_,i) => renderPos(i));
    if(snake.length>1){
      ctx.save();
      ctx.lineCap="round";
      ctx.lineJoin="round";
      ctx.strokeStyle="#3d8fe8";
      ctx.lineWidth=CELL*.76;
      ctx.beginPath();
      ctx.moveTo((positions[positions.length-1].x+.5)*CELL,(positions[positions.length-1].y+.5)*CELL);
      for(let i=positions.length-2;i>=0;i--){
        ctx.lineTo((positions[i].x+.5)*CELL,(positions[i].y+.5)*CELL);
      }
      ctx.stroke();
      ctx.restore();
    }

    // لایه‌ی نرم روی بدن، بدون فاصله بین قطعات.
    for(let i=snake.length-1;i>=1;i--){
      const s=positions[i];
      const t=1-i/Math.max(1,snake.length);
      const r=CELL*.39;
      const rr=Math.floor(49+t*35);
      const gg=Math.floor(121+t*45);
      const bb=Math.floor(205+t*35);
      ctx.fillStyle=`rgb(${rr},${gg},${bb})`;
      ctx.beginPath();
      ctx.arc((s.x+.5)*CELL,(s.y+.5)*CELL,r,0,Math.PI*2);
      ctx.fill();
    }

    // سر مار.
    const head=positions[0];
    const hx=(head.x+.5)*CELL, hy=(head.y+.5)*CELL;
    ctx.save();
    ctx.fillStyle="#63a9f5";
    ctx.shadowColor="#3d8fe8";
    ctx.shadowBlur=12;
    ctx.beginPath();
    ctx.arc(hx,hy,CELL*.45,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    const eyeR=2.2;
    let ex1,ey1,ex2,ey2;
    if(dir.x>0){ex1=hx+CELL*.68;ey1=hy+CELL*.32;ex2=hx+CELL*.68;ey2=hy+CELL*.68}
    else if(dir.x<0){ex1=hx+CELL*.32;ey1=hy+CELL*.32;ex2=hx+CELL*.32;ey2=hy+CELL*.68}
    else if(dir.y<0){ex1=hx+CELL*.32;ey1=hy+CELL*.32;ex2=hx+CELL*.68;ey2=hy+CELL*.32}
    else {ex1=hx+CELL*.32;ey1=hy+CELL*.68;ex2=hx+CELL*.68;ey2=hy+CELL*.68}
    ctx.fillStyle="#07111f";
    ctx.beginPath();ctx.arc(ex1,ey1,eyeR,0,Math.PI*2);ctx.arc(ex2,ey2,eyeR,0,Math.PI*2);ctx.fill();

    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle="#ffd76a";
      ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
  }

  let last=performance.now();
  function loop(now){
    const dt=Math.min(50,now-last); last=now;
    if(running && !paused && !gameOver){
      accumulator += dt;
      while(accumulator >= moveInterval){
        step();
        accumulator -= moveInterval;
        if(!running) break;
      }
    }
    for(const p of particles){
      p.x+=p.vx; p.y+=p.vy; p.vx*=.96; p.vy*=.96; p.life-=.045;
    }
    particles=particles.filter(p=>p.life>0);
    draw();
    requestAnimationFrame(loop);
  }

  document.addEventListener("keydown", e => {
    const k=e.key.toLowerCase();
    const c=e.code;
    if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space","KeyW","KeyA","KeyS","KeyD","KeyP","KeyR"].includes(c)) e.preventDefault();

    if(c==="ArrowUp"||c==="KeyW"||k==="w") setDirection(0,-1);
    else if(c==="ArrowDown"||c==="KeyS"||k==="s") setDirection(0,1);
    else if(c==="ArrowLeft"||c==="KeyA"||k==="a") setDirection(-1,0);
    else if(c==="ArrowRight"||c==="KeyD"||k==="d") setDirection(1,0);
    else if(c==="Space"||c==="KeyP") togglePause();
    else if(c==="KeyR") reset();
  });

  pauseBtn.addEventListener("click",togglePause);
  document.getElementById("restartBtn").addEventListener("click",reset);
  overlayBtn.addEventListener("click",()=>{
    if(paused) togglePause();
    else reset();
  });

  window.addEventListener("resize", resize);

  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
